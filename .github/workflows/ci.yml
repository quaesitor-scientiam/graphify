name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Built from source rather than a third-party marketplace action, per
      # V's own documented install method — avoids depending on an action
      # that could be renamed or go unmaintained. Cloned into RUNNER_TEMP
      # (outside the checkout) so `v test .` below only ever sees graphify's
      # own tests — cloning into the workspace once made `v test .` also
      # sweep up V's own ~3600-file vlib test suite (GL headers, globals,
      # multi-hour runtime) as if it were part of this project.
      - name: Install V
        run: |
          git clone --depth 1 https://github.com/vlang/v "$RUNNER_TEMP/v"
          cd "$RUNNER_TEMP/v"
          make
          sudo ./v symlink

      - name: Build CLI
        run: v -prod -gc none -o bin/graphify cmd/cli

      - name: Build hook binary
        # `build`, not plain `v file.vsh`: a .vsh is otherwise compiled AND run.
        run: v -prod -gc none -o bin/graphify-hook build cmd/hooks/graphify_hook.vsh

      - name: Build MCP server
        run: v -prod -o bin/graphify-mcp cmd/mcp

      # Real end-to-end proof this platform's build actually works, not
      # just that it compiles — extracts graphify's own source.
      - name: Smoke test — extract graphify's own source
        run: |
          ./bin/graphify extract . --out /tmp/graphify-ci-out
          test -f /tmp/graphify-ci-out/graph.json
          cat /tmp/graphify-ci-out/GRAPH_REPORT.md

      - name: Smoke test — hook binary handles empty stdin without crashing
        run: |
          printf '' | ./bin/graphify-hook

      # The PreToolUse reminder must fire for a Grep scoped to a .v path that
      # also carries a pattern -- i.e. nearly every real Grep. It once didn't:
      # the input fields were joined into one string, so only the last one was
      # checked for `.v`. Also asserts a non-V path still gets no reminder.
      - name: Smoke test — hook fires for a Grep on a .v path, not on others
        run: |
          mkdir -p /tmp/graphify-hook-proj/graphify-out
          cp /tmp/graphify-ci-out/graph.json /tmp/graphify-hook-proj/graphify-out/
          grep_on() {
            printf '{"hook_event_name":"PreToolUse","tool_name":"Grep","tool_input":{"pattern":"fn main","path":"%s"}}' "$1" \
              | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-proj ./bin/graphify-hook
          }
          grep_on /tmp/graphify-hook-proj/main.v | grep -q additionalContext
          test "$(grep_on /tmp/graphify-hook-proj/README.md)" = '{}'

  # The tests, on every OS, and a check that extraction gives the same graph
  # on every OS (FUTURE_WORK.md section 8): each runner extracts the same
  # vlang commit, the one V itself is built from, and same-graph compares
  # the results.
  pin-vlang:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=$(git ls-remote https://github.com/vlang/v HEAD | cut -f1)" >> "$GITHUB_OUTPUT"

  extract-on-every-os:
    needs: pin-vlang
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `shell: bash` on Windows runs whichever bash.exe comes first on PATH,
      # and on some runner images that is WSL's stub in WindowsApps, which
      # fails with no Linux distribution installed. Put Git Bash first.
      - name: Use Git Bash for bash steps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "C:\Program Files\Git\bin"

      # Outside the workspace, as in build-and-smoke-test, and at the pinned
      # commit, so every runner extracts the same tree.
      - name: Fetch V at the pinned commit
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/v"
          cd "$RUNNER_TEMP/v"
          git fetch -q --depth 1 https://github.com/vlang/v ${{ needs.pin-vlang.outputs.sha }}
          git checkout -q FETCH_HEAD

      - name: Build V
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/v
        run: make && sudo ./v symlink

      - name: Build V (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/v
        run: ./makev.bat && ./v symlink

      - name: Run tests
        run: v test .

      - name: Build CLI
        run: v -o bin/graphify cmd/cli

      # From a clean checkout of the same commit: building V leaves generated
      # files beside its sources, and they may differ between platforms.
      - name: Extract the pinned vlang tree
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/v" worktree add -q "$RUNNER_TEMP/vlang" HEAD
          ./bin/graphify extract "$RUNNER_TEMP/vlang" --out "$RUNNER_TEMP/graph-out"
          cat "$RUNNER_TEMP/graph-out/GRAPH_REPORT.md"

      - uses: actions/upload-artifact@v4
        with:
          name: graph-${{ matrix.os }}
          path: ${{ runner.temp }}/graph-out/graph.json
          retention-days: 5

  same-graph:
    needs: extract-on-every-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-*
          path: graphs
      - name: Compare the graphs
        run: python3 .github/scripts/same_graph.py graphs/*/graph.json
