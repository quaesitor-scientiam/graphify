name: CI

on:
  push:
  pull_request:

jobs:
  build-and-smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Built from source rather than a third-party marketplace action, per
      # V's own documented install method — avoids depending on an action
      # that could be renamed or go unmaintained. Cloned into RUNNER_TEMP
      # (outside the checkout) so `v test .` below only ever sees graphify's
      # own tests — cloning into the workspace once made `v test .` also
      # sweep up V's own ~3600-file vlib test suite (GL headers, globals,
      # multi-hour runtime) as if it were part of this project.
      - name: Install V
        run: |
          git clone --depth 1 https://github.com/vlang/v "$RUNNER_TEMP/v"
          cd "$RUNNER_TEMP/v"
          make
          # graphify's extractor imports V's removed V1 frontend (v.ast), which
          # current V provides only through its V 0.5.2 compatibility compiler,
          # requested with -old-compiler below. Install it here so a provisioning
          # failure shows up in this step (see FUTURE_WORK.md section 6).
          make v1
          sudo ./v symlink

      - name: Build CLI
        run: v -old-compiler -prod -gc none -o bin/graphify cmd/cli

      - name: Build hook binary
        # `build`, not plain `v file.vsh`: a .vsh is otherwise compiled AND run.
        run: v -old-compiler -prod -gc none -o bin/graphify-hook build cmd/hooks/graphify_hook.vsh

      - name: Build MCP server
        run: v -old-compiler -prod -o bin/graphify-mcp cmd/mcp

      - name: Run tests
        run: v -old-compiler test .

      # Real end-to-end proof this platform's build actually works, not
      # just that it compiles — extracts graphify's own source.
      - name: Smoke test — extract graphify's own source
        run: |
          ./bin/graphify extract . --out /tmp/graphify-ci-out
          test -f /tmp/graphify-ci-out/graph.json
          cat /tmp/graphify-ci-out/GRAPH_REPORT.md

      - name: Smoke test — hook binary handles empty stdin without crashing
        run: |
          printf '' | ./bin/graphify-hook

      # The PreToolUse reminder must fire for a Grep scoped to a .v path that
      # also carries a pattern -- i.e. nearly every real Grep. It once didn't:
      # the input fields were joined into one string, so only the last one was
      # checked for `.v`. Also asserts a non-V path still gets no reminder.
      - name: Smoke test — hook fires for a Grep on a .v path, not on others
        run: |
          mkdir -p /tmp/graphify-hook-proj/graphify-out
          cp /tmp/graphify-ci-out/graph.json /tmp/graphify-hook-proj/graphify-out/
          grep_on() {
            printf '{"hook_event_name":"PreToolUse","tool_name":"Grep","tool_input":{"pattern":"fn main","path":"%s"}}' "$1" \
              | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-proj ./bin/graphify-hook
          }
          grep_on /tmp/graphify-hook-proj/main.v | grep -q additionalContext
          test "$(grep_on /tmp/graphify-hook-proj/README.md)" = '{}'
