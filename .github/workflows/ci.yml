name: CI

on:
  push:
  pull_request:

# The vlang commit every job builds V from, when V's newest one is broken: empty
# takes the newest. Set to one while V's newest crashes its own build, and emptied
# again once a later commit builds. VC_PIN is the vc snapshot generated from that
# commit: the Windows bootstrap (makev.bat) otherwise clones vc's HEAD. Set and
# emptied together with VLANG_PIN.
env:
  VLANG_PIN:
  VC_PIN:

jobs:
  build-and-smoke-test:
    needs: pin-vlang
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Built from source rather than a third-party marketplace action, per
      # V's own documented install method — avoids depending on an action
      # that could be renamed or go unmaintained. Cloned into RUNNER_TEMP
      # (outside the checkout) so `v test .` below only ever sees graphify's
      # own tests — cloning into the workspace once made `v test .` also
      # sweep up V's own ~3600-file vlib test suite (GL headers, globals,
      # multi-hour runtime) as if it were part of this project.
      - name: Install V
        run: |
          git init -q "$RUNNER_TEMP/v"
          cd "$RUNNER_TEMP/v"
          git fetch -q --depth 1 https://github.com/vlang/v ${{ needs.pin-vlang.outputs.sha }}
          git checkout -q FETCH_HEAD
          make
          sudo ./v symlink

      - name: Build CLI
        run: v -prod -o bin/graphify cmd/cli

      - name: Build hook binary
        # `build`, not plain `v file.vsh`: a .vsh is otherwise compiled AND run.
        run: v -prod -o bin/graphify-hook build cmd/hooks/graphify_hook.vsh

      - name: Build MCP server
        run: v -prod -o bin/graphify-mcp cmd/mcp

      # Real end-to-end proof this platform's build actually works, not
      # just that it compiles — extracts graphify's own source.
      - name: Smoke test — extract graphify's own source
        run: |
          ./bin/graphify extract . --out /tmp/graphify-ci-out
          test -f /tmp/graphify-ci-out/graph.json
          cat /tmp/graphify-ci-out/GRAPH_REPORT.md

      - name: Smoke test — hook binary handles empty stdin without crashing
        run: |
          printf '' | ./bin/graphify-hook

      # The hook runs on every Read, Grep and Glob, so input it cannot use must
      # give `{}`, never a crash or a reminder. Includes a graph.json that is
      # truncated: the reminder says the graph is available, so none may be sent.
      - name: Smoke test — hook fails open on malformed input
        run: |
          for input in '{' '"hello"' '[1,2]' '{"hook_event_name":"PreToolUse","tool_input":"oops"}'; do
            test "$(printf '%s' "$input" | ./bin/graphify-hook)" = '{}'
          done
          mkdir -p /tmp/graphify-hook-corrupt/graphify-out
          printf '{"symbols":[{"id":"a"' > /tmp/graphify-hook-corrupt/graphify-out/graph.json
          test "$(printf '%s' '{"hook_event_name":"PreToolUse","tool_input":{"file_path":"/tmp/x.v"}}' | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-corrupt ./bin/graphify-hook)" = '{}'
          test "$(printf '%s' '{"hook_event_name":"SessionStart"}' | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-corrupt ./bin/graphify-hook)" = '{}'
          mkdir -p /tmp/graphify-hook-shape/graphify-out
          printf '{"symbols":5}' > /tmp/graphify-hook-shape/graphify-out/graph.json
          test "$(printf '%s' '{"hook_event_name":"PreToolUse","tool_input":{"file_path":"/tmp/x.v"}}' | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-shape ./bin/graphify-hook)" = '{}'
          # A sidecar truncated by a killed write, with a newer mtime than graph.json,
          # must be rebuilt, not trusted: the reminder for a file in the graph still fires.
          mkdir -p /tmp/graphify-hook-sidecar/graphify-out
          cp /tmp/graphify-ci-out/graph.json /tmp/graphify-hook-sidecar/graphify-out/graph.json
          : > /tmp/graphify-hook-sidecar/graphify-out/graph.json.files
          test "$(printf '%s' '{"hook_event_name":"PreToolUse","tool_input":{"file_path":"/tmp/graphify-hook-sidecar/graph_ops.v"}}' | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-sidecar ./bin/graphify-hook)" != '{}'

      # The PreToolUse reminder must fire for a Grep scoped to a .v path that
      # also carries a pattern -- i.e. nearly every real Grep. It once didn't:
      # the input fields were joined into one string, so only the last one was
      # checked for `.v`. Also asserts a non-V path still gets no reminder.
      - name: Smoke test — hook fires for a Grep on a .v path, not on others
        run: |
          mkdir -p /tmp/graphify-hook-proj/graphify-out
          cp /tmp/graphify-ci-out/graph.json /tmp/graphify-hook-proj/graphify-out/
          grep_on() {
            printf '{"hook_event_name":"PreToolUse","tool_name":"Grep","tool_input":{"pattern":"fn main","path":"%s"}}' "$1" \
              | CLAUDE_PROJECT_DIR=/tmp/graphify-hook-proj ./bin/graphify-hook
          }
          grep_on /tmp/graphify-hook-proj/main.v | grep -q additionalContext
          test "$(grep_on /tmp/graphify-hook-proj/README.md)" = '{}'

      # A Claude Code worktree sits inside the main checkout, which is a
      # directory named `graphify`; `import graphify` once resolved to it
      # rather than to the worktree (FUTURE_WORK.md section 9). Build a copy
      # in that layout and fail if any graphify source comes from outside it.
      # Last, so the copy isn't in the smoke test's extract.
      - name: A worktree builds its own sources
        run: |
          wt=.claude/worktrees/ci-check
          mkdir -p "$wt"
          git archive HEAD | tar -x -C "$wt"
          cd "$wt"
          v -print-v-files cmd/cli > files.txt
          grep -q '/ci-check/backend_v.v$' files.txt
          ! grep -v '/vlib/' files.txt | grep -v '/ci-check/'
          v -o /tmp/graphify-wt cmd/cli

  # The tests, on every OS, and a check that extraction gives the same graph
  # on every OS (FUTURE_WORK.md section 8): each runner extracts the same
  # vlang commit, the one V itself is built from, and same-graph compares
  # the results.
  pin-vlang:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        run: echo "sha=${VLANG_PIN:-$(git ls-remote https://github.com/vlang/v HEAD | cut -f1)}" >> "$GITHUB_OUTPUT"

  extract-on-every-os:
    needs: pin-vlang
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Outside the workspace, as in build-and-smoke-test, and at the pinned
      # commit, so every runner extracts the same tree.
      #
      # Each step has a Windows copy and a copy for the other OSes. The Windows
      # copies run in PowerShell: `shell: bash` there takes the first bash.exe
      # on PATH, and after `v symlink` (Build V) the bash in the Extract step
      # was WSL's stub in WindowsApps, which fails with no Linux distribution
      # installed. A step's shell cannot use `runner` or `matrix`, hence two
      # copies.
      - name: Fetch V at the pinned commit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git init -q "$env:RUNNER_TEMP\v"
          cd "$env:RUNNER_TEMP\v"
          git fetch -q --depth 1 https://github.com/vlang/v ${{ needs.pin-vlang.outputs.sha }}
          git checkout -q FETCH_HEAD

      - name: Fetch V at the pinned commit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git init -q "$RUNNER_TEMP/v"
          cd "$RUNNER_TEMP/v"
          git fetch -q --depth 1 https://github.com/vlang/v ${{ needs.pin-vlang.outputs.sha }}
          git checkout -q FETCH_HEAD

      - name: Build V
        if: runner.os != 'Windows'
        working-directory: ${{ runner.temp }}/v
        run: make && sudo ./v symlink

      # makev.bat clones vc, V's C bootstrap snapshot, from its HEAD. The newest
      # snapshot is generated from V's newest source, which TCC rejects on Windows
      # (vlang/v #30991), so clone the one generated from VLANG_PIN instead. makev
      # clones into a folder named vc, so the clone has to be named that.
      - name: Fetch the vc snapshot for the pinned V (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone -q --filter=blob:none https://github.com/vlang/vc "$env:RUNNER_TEMP\vc-pin\vc"
          git -C "$env:RUNNER_TEMP\vc-pin\vc" checkout -q ${{ env.VC_PIN }}

      - name: Build V (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ runner.temp }}/v
        env:
          VC_GIT: ${{ runner.temp }}\vc-pin\vc
        run: ./makev.bat && ./v symlink

      - name: Run tests
        run: v test .

      - name: Build CLI
        run: v -o bin/graphify cmd/cli

      # The MCP daemon end to end (daemon.v): two servers share one daemon, each exits
      # with its client, and the daemon goes away once its binary is rebuilt. On
      # Windows it runs from a copy of the binary, started detached.
      - name: Build MCP server
        run: v -o bin/graphify-mcp cmd/mcp

      - name: Daemon end to end (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\bin\graphify.exe extract . --out "$env:RUNNER_TEMP\self-out"
          python .github/scripts/daemon_smoke.py bin\graphify-mcp.exe "$env:RUNNER_TEMP\self-out\graph.json" file_stamp

      - name: Daemon end to end
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./bin/graphify extract . --out "$RUNNER_TEMP/self-out"
          python3 .github/scripts/daemon_smoke.py bin/graphify-mcp "$RUNNER_TEMP/self-out/graph.json" file_stamp

      # From a clean checkout of the same commit: building V leaves generated
      # files beside its sources, and they may differ between platforms.
      - name: Extract the pinned vlang tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git -C "$env:RUNNER_TEMP\v" worktree add -q "$env:RUNNER_TEMP\vlang" HEAD
          .\bin\graphify.exe extract "$env:RUNNER_TEMP\vlang" --out "$env:RUNNER_TEMP\graph-out"
          Get-Content "$env:RUNNER_TEMP\graph-out\GRAPH_REPORT.md"

      - name: Extract the pinned vlang tree
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git -C "$RUNNER_TEMP/v" worktree add -q "$RUNNER_TEMP/vlang" HEAD
          ./bin/graphify extract "$RUNNER_TEMP/vlang" --out "$RUNNER_TEMP/graph-out"
          cat "$RUNNER_TEMP/graph-out/GRAPH_REPORT.md"

      - uses: actions/upload-artifact@v4
        with:
          name: graph-${{ matrix.os }}
          path: ${{ runner.temp }}/graph-out/graph.json
          retention-days: 5

  same-graph:
    needs: extract-on-every-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: graph-*
          path: graphs
      - name: Compare the graphs
        run: python3 .github/scripts/same_graph.py graphs/*/graph.json
